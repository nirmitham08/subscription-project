<!DOCTYPE html>
<html>

<head>

    <title>Usage Analytics</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>📊 Usage Analytics</h1>

<div id="usage" class="grid"></div>

<script>

const API = "http://localhost:5000";

// GET LOGGED USER
const user = JSON.parse(
    localStorage.getItem("user")
);

// IF NO LOGIN
if(!user){

    window.location.href =
    "login.html";

}

// LOAD USAGE
async function loadUsage(){

    const res = await fetch(

        API + "/user-usage/" + user.user_id

    );

    const data = await res.json();

    const usage =
    document.getElementById("usage");

    usage.innerHTML = "";

    // IF EMPTY
    if(data.length === 0){

        usage.innerHTML = `

            <div class="card">

                <h2>

                    No Usage Data Found

                </h2>

            </div>

        `;

        return;
    }

    // SHOW DATA
    data.forEach(item => {

        usage.innerHTML += `

            <div class="card">

                <h2>

                    ${item.service_name}

                </h2>

                <h3>

                    ${item.total_usage}
                    mins used

                </h3>

                <h3>

                    ${item.status}

                </h3>

            </div>

        `;

    });

}

loadUsage();

</script>

</body>

</html>
