<!DOCTYPE html>
<html>

<head>

    <title>Admin Portal</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<h1>👨‍💼 Admin Portal</h1>

<h2>Users</h2>

<div id="users"></div>

<br>

<div id="userinfo"></div>

<hr>

<h2>User Usage Analytics</h2>

<div id="analytics" class="grid"></div>

<script>

const API = "http://localhost:5000";

// LOAD ALL USERS
async function loadUsers(){

    const res = await fetch(

        API + "/all-users"

    );

    const users = await res.json();

    const usersDiv =
    document.getElementById("users");

    usersDiv.innerHTML = "";

    users.forEach(user => {

        usersDiv.innerHTML += `

            <button onclick="
            loadUsage(${user.user_id})
            ">

                ${user.name}

            </button>

        `;

    });

}

// LOAD USER INFO + USAGE
async function loadUsage(user_id){

    // USER INFO
    const infoRes = await fetch(

        API + "/user-info/" + user_id

    );

    const infoData =
    await infoRes.json();

    const user =
    infoData[0];

    document.getElementById(
        "userinfo"
    ).innerHTML = `

        <div class="card">

            <h2>

                👤 ${user.name}

            </h2>

            <h3>

                📧 ${user.email}

            </h3>

            <h3>

                💰 Budget:
                ₹${user.budget}

            </h3>

            <h3>

                📦 Subscriptions:
                ${user.total_subscriptions}

            </h3>

            <h3>

                💸 Spending:
                ₹${user.total_spending}

            </h3>

            <h3>

                ⏱ Total Usage:
                ${user.total_usage} mins

            </h3>

        </div>

    `;

    // USAGE ANALYTICS
    const res = await fetch(

        API + "/user-usage/" + user_id

    );

    const data = await res.json();

    const analytics =
    document.getElementById("analytics");

    analytics.innerHTML = "";

    if(data.length === 0){

        analytics.innerHTML = `

            <div class="card">

                <h2>

                    No Usage Data Found

                </h2>

            </div>

        `;

        return;

    }

    data.forEach(item => {

        analytics.innerHTML += `

            <div class="card">

                <h2>

                    ${item.service_name}

                </h2>

                <h3>

                    ⏱ ${item.total_usage}
                    mins used

                </h3>

                <h3>

                    ${item.status}

                </h3>

            </div>

        `;

    });

}

loadUsers();

</script>

</body>

</html>
