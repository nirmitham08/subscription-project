<!DOCTYPE html>
<html>

<head>

    <title>My Subscriptions</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="topbar">

    <div>

        <h1>My Subscriptions</h1>

        <h2 id="welcome"></h2>

    </div>

    <button onclick="logout()">

        Logout

    </button>

</div>

<hr>

<button onclick="window.location.href='add.html'">

    ➕ Add Subscription

</button>

<a href="usage.html">

    <button>

        📊 Usage Analytics

    </button>

</a>

<a href="admin.html">

    <button>

        👨‍💼 Admin Portal

    </button>

</a>

<br><br>

<input
type="number"
id="budget"
placeholder="Enter Monthly Budget">

<button onclick="saveBudget()">

    Save Budget

</button>

<div class="card">

    <h2>

        Total Monthly Cost:
        ₹<span id="total">0</span>

    </h2>

    <h2 id="warning"></h2>

</div>

<div id="list" class="grid"></div>

<script>

const API = "http://localhost:5000";

const user = JSON.parse(
    localStorage.getItem("user")
);

// LOGIN CHECK
if(!user){

    window.location.href =
    "login.html";

}

// SHOW USER NAME
document.getElementById("welcome")
.innerHTML =
"Welcome, " + user.name + " 👋";

// LOAD SUBSCRIPTIONS
async function loadSubscriptions(){

    const res = await fetch(

        API + "/subscriptions/" + user.user_id

    );

    const data = await res.json();

    const list =
    document.getElementById("list");

    list.innerHTML = "";

    let total = 0;

    data.forEach(sub => {

        const price =
        sub.custom_price ||
        sub.monthly_cost;

        total += Number(price);

        list.innerHTML += `

            <div class="card">

                <h2>

                    ${sub.service_name}

                </h2>

                <h3>

                    ₹${price}

                </h3>

                <input
                type="number"

                id="price${sub.subscription_id}"

                placeholder="Update Amount">

                <br>

                <button onclick="
                updatePrice(
                ${sub.subscription_id}
                )">

                    Update

                </button>

                <button onclick="
                deleteSub(
                ${sub.subscription_id}
                )">

                    Delete

                </button>

            </div>

        `;
    });

    document.getElementById("total")
    .innerHTML = total;

    checkBudget(total);

}

// DELETE SUBSCRIPTION
async function deleteSub(id){

    await fetch(

        API + "/subscriptions/" + id,

        {

            method:"DELETE"

        }
    );

    loadSubscriptions();

}

// UPDATE PRICE
async function updatePrice(id){

    const price = document.getElementById(

        "price" + id

    ).value;

    await fetch(

        API + "/update-price",

        {

            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                subscription_id:id,
                price

            })

        }
    );

    loadSubscriptions();

}

// SAVE BUDGET
async function saveBudget(){

    const budget =
    document.getElementById("budget").value;

    await fetch(

        API + "/budget",

        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                user_id:user.user_id,

                monthly_limit:budget

            })

        }
    );

    alert("Budget Saved");

}

// CHECK BUDGET
async function checkBudget(total){

    const res = await fetch(

        API + "/budget/" + user.user_id

    );

    const data = await res.json();

    if(data.length > 0){

        const limit =
        data[0].monthly_limit;

        if(total > limit){

            document.getElementById(
                "warning"
            ).innerHTML =

            "⚠ Budget Exceeded";

            document.getElementById(
                "warning"
            ).className = "warning";

        }

        else{

            document.getElementById(
                "warning"
            ).innerHTML =

            "✅ Within Budget";

            document.getElementById(
                "warning"
            ).className = "success";

        }

    }

}

// LOGOUT
function logout(){

    localStorage.removeItem("user");

    window.location.href =
    "login.html";

}

loadSubscriptions();

</script>

</body>

</html>
