<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="style.css">

    <title>Login</title>

    <style>

        body{
            background:#111827;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:#1f2937;
            padding:40px;
            border-radius:15px;
            width:300px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

    </style>

</head>

<body class="center">

<div class="login-box">

<h1>Subscription Manager</h1>

<input type="text"
id="name"
placeholder="Enter Name">

<input type="email"
id="email"
placeholder="Enter Email">

<button onclick="login()">

Login

</button>

</div>

</body>

</html>
