<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <style>

        body{
            background:#111827;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:#1f2937;
            padding:40px;
            border-radius:15px;
            width:300px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:10px;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            margin-top:15px;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Login</h1>

    <input type="text"
    id="name"
    placeholder="Name">

    <input type="email"
    id="email"
    placeholder="Email">

    <button onclick="login()">

        Continue

    </button>

</div>

<script>

const API = "http://localhost:5000";

async function login(){

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const res = await fetch(

        API + "/login",

        {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({
                name,
                email
            })

        }
    );

    const data = await res.json();

    localStorage.setItem(
        "user",
        JSON.stringify(data)
    );

    window.location.href = "index.html";

}

</script>

</body>

</html>
